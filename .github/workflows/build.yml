name: Build Pet Goose

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile Java
        shell: bash
        run: |
          rm -rf build
          mkdir -p build/classes
          mkdir -p build/input
          find src -name "*.java" > sources.txt
          javac -d build/classes @sources.txt
          cp -R res/. build/classes/

      - name: Create JAR
        shell: bash
        run: |
          jar --create \
            --file build/input/Pet-Goose.jar \
            --main-class main.Main \
            -C build/classes .

      - name: Create Windows application
        shell: bash
        run: |
          mkdir -p build/package

          jpackage \
            --type app-image \
            --input build/input \
            --name Pet-Goose \
            --main-jar Pet-Goose.jar \
            --main-class main.Main \
            --dest build/package \
            --app-version 1.0.0 \
            --vendor "Pet Goose"
      - name: Zip Windows application
        shell: bash
        run: |
          cd build/package
          7z a ../../Pet-Goose-Windows.zip "Pet-Goose"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Pet-Goose-Windows
          path: Pet-Goose-Windows.zip


  build-macos-arm64:
    name: Build macOS Apple Silicon
    runs-on: macos-15

    steps:
