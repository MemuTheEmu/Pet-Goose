      - name: Create JAR
        shell: bash
        run: |
          jar --create \
            --file build/input/Pet-Goose.jar \
            --main-class main.Main \
            -C build/classes .

      - name: Create macOS application
        shell: bash
        run: |
          mkdir -p build/package

          jpackage \
            --type app-image \
            --input build/input \
            --name Pet-Goose \
            --main-jar Pet-Goose.jar \
            --main-class main.Main \
            --dest build/package \
            --app-version 1.0.0 \
