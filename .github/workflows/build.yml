name: Build Pet Goose

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile Java
        shell: bash
        run: |
          rm -rf build
          mkdir -p build/classes
          mkdir -p build/input

          find src -name "*.java" > sources.txt

          javac -d build/classes @sources.txt

          cp -R res/. build/classes/

      - name: Create JAR
        shell: bash
        run: |
          jar --create \
            --file build/input/Pet-Goose.jar \
            --main-class main.Main \
            -C build/classes .

      - name: Create Windows app
        shell: bash
        run: |
          mkdir -p build/package

          jpackage \
            --type app-image \
            --input build/input \
            --name Pet-Goose \
            --main-jar Pet-Goose.jar \
            --main-class main.Main \
            --dest build/package \
            --app-version 1.0.0 \
            --vendor "Pet Goose"

      - name: Verify Windows app
        shell: bash
        run: |
          echo "=== WINDOWS APP ==="
          ls -la build/package/Pet-Goose

          echo "=== APP FOLDER ==="
          ls -la build/package/Pet-Goose/app

          echo "=== RUNTIME FOLDER ==="
          ls -la build/package/Pet-Goose/runtime

          echo "=== EXE ==="
          ls -la build/package/Pet-Goose/Pet-Goose.exe

      - name: Create Windows ZIP
        shell: bash
        run: |
          cd build/package
          7z a -tzip ../../Pet-Goose-Windows.zip Pet-Goose

      - name: Verify Windows ZIP
        shell: bash
        run: |
          echo "=== ZIP CONTENTS ==="
          7z l Pet-Goose-Windows.zip

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Pet-Goose-Windows
          path: Pet-Goose-Windows.zip
          if-no-files-found: error


  # ============================================================
  # MACOS APPLE SILICON
  # ============================================================
  build-macos-arm64:
    name: Build macOS Apple Silicon
    runs-on: macos-15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile Java
        shell: bash
        run: |
          rm -rf build
          mkdir -p build/classes
          mkdir -p build/input

          find src -name "*.java" > sources.txt

          javac -d build/classes @sources.txt

          cp -R res/. build/classes/

      - name: Create JAR
        shell: bash
        run: |
          jar --create \
            --file build/input/Pet-Goose.jar \
            --main-class main.Main \
            -C build/classes .

      - name: Create macOS application
        shell: bash
        run: |
          mkdir -p build/package

          jpackage \
            --type app-image \
            --input build/input \
            --name Pet-Goose \
            --main-jar Pet-Goose.jar \
            --main-class main.Main \
            --dest build/package \
            --app-version 1.0.0 \
            --vendor "Pet Goose"

      - name: Create macOS ZIP
        shell: bash
        run: |
          cd build/package
          zip -r ../../Pet-Goose-macOS-AppleSilicon.zip Pet-Goose.app

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: Pet-Goose-macOS-AppleSilicon
          path: Pet-Goose-macOS-AppleSilicon.zip
          if-no-files-found: error


  # ============================================================
  # MACOS INTEL
  # ============================================================
  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-15-intel

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile Java
        shell: bash
        run: |
          rm -rf build
          mkdir -p build/classes
          mkdir -p build/input

          find src -name "*.java" > sources.txt

          javac -d build/classes @sources.txt

          cp -R res/. build/classes/

      - name: Create JAR
        shell: bash
        run: |
          jar --create \
            --file build/input/Pet-Goose.jar \
            --main-class main.Main \
            -C build/classes .

      - name: Create macOS application
        shell: bash
        run: |
          mkdir -p build/package

          jpackage \
            --type app-image \
            --input build/input \
            --name Pet-Goose \
            --main-jar Pet-Goose.jar \
            --main-class main.Main \
            --dest build/package \
            --app-version 1.0.0 \
            --vendor "Pet Goose"

      - name: Create macOS ZIP
        shell: bash
        run: |
          cd build/package
          zip -r ../../Pet-Goose-macOS-Intel.zip Pet-Goose.app

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: Pet-Goose-macOS-Intel
          path: Pet-Goose-macOS-Intel.zip
          if-no-files-found: error
